# ==============================================================================
# SonarQube Project Configuration for Cajero Mobile
# ==============================================================================

# Project Identification
sonar.projectKey=cajero-mobile
sonar.projectName=Cajero Mobile
sonar.projectVersion=1.1.0

# Source & Test Code Definitions
sonar.sources=app,components,db,hooks,lib,services,store,utils,index.ts
sonar.tests=app,components,db,hooks,lib,services,store,utils
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**

# Exclusions
sonar.exclusions=\
  node_modules/**,\
  android/**,\
  ios/**,\
  .expo/**,\
  coverage/**,\
  dist/**,\
  builds/**,\
  .maestro/**,\
  scripts/**,\
  jest.config.js,\
  jest.setup.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/__mocks__/**,\
  **/__tests__/**

# Coverage & Quality Reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.sonar.json
sonar.sourceEncoding=UTF-8

# Duplicate Code Detection Exclusions
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/__mocks__/**

