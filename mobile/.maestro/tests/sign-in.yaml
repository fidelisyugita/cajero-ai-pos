appId: com.cajero.app
---
# ==========================================================
# CAJERO POS - E2E AUTHENTICATION TEST SUITE
# ==========================================================

# 1. Launch App
- runFlow:
    file: ../flows/launch.yaml

# ==========================================================
# 2. UI SMOKE TEST
# ==========================================================
- assertVisible:
    text: "Sign In"
- assertVisible:
    text: "Email"
- assertVisible:
    text: "Password"
- assertVisible:
    id: "sign-in-button"

# ==========================================================
# 3. EMPTY FORM VALIDATION
# ==========================================================
- tapOn:
    id: "sign-in-button"

- assertVisible:
    text: "Email is required"

# ==========================================================
# 4. INVALID EMAIL FORMAT
# ==========================================================
- runFlow:
    file: ../flows/sign-in.yaml
    env:
      EMAIL: "invalid-email"
      PASSWORD: "password123"

- assertVisible:
    text: "Invalid email address"

# ==========================================================
# 5. SHORT PASSWORD VALIDATION (< 6 chars)
# ==========================================================
- runFlow:
    file: ../flows/sign-in.yaml
    env:
      EMAIL: "${TEST_EMAIL}"
      PASSWORD: "123"

- assertVisible:
    text: "Password must be at least 6 characters"

# ==========================================================
# 6. WRONG CREDENTIALS REJECTION
# ==========================================================
- runFlow:
    file: ../flows/sign-in.yaml
    env:
      EMAIL: "${TEST_EMAIL}"
      PASSWORD: "wrongpassword123"

- assertVisible:
    text: "Incorrect email or password.*"

# Dismiss error alert dialog
- tapOn:
    text: "(?i)ok|close"
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

# ==========================================================
# 7. SUCCESSFUL LOGIN
# ==========================================================
- runFlow:
    file: ../flows/sign-in.yaml
    env:
      EMAIL: "${TEST_EMAIL}"
      PASSWORD: "${TEST_PASSWORD}"

- waitForAnimationToEnd:
    timeout: 10000

# Assert Dashboard Landing
- assertVisible:
    text: "Menu"
- assertVisible:
    text: "Sign Out"

# ==========================================================
# 8. CLEAN SIGN OUT
# ==========================================================
- runFlow:
    file: ../flows/sign-out.yaml
