name: Mobile CI (Lint & Test)

on:
  push:
    branches:
      - main
      - dev-mobile
      - "feat/**"
      - "fix/**"
    paths:
      - "mobile/**"
      - ".github/workflows/dev-mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/dev-mobile.yml"

jobs:
  mobile-ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack & Yarn Berry
        run: |
          corepack enable
          corepack prepare yarn@4.9.3 --activate

      - name: Get Yarn Cache Directory
        id: yarn-cache-dir
        run: echo "cache_dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.cache_dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('mobile/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Biome Linter Check
        run: yarn lint

      - name: Biome Formatter Check
        run: yarn format:check

      - name: TypeScript Type Check
        run: yarn tsc --noEmit

      - name: Jest Unit Tests
        run: yarn test --ci --maxWorkers=2

