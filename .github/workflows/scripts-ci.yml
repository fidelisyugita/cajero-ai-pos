name: Root Scripts CI

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "package.json"
      - "mobile/package.json"
      - ".github/workflows/scripts-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"
      - "package.json"
      - "mobile/package.json"
      - ".github/workflows/scripts-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts-ci:
    name: Test Root Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run root script tests
        run: yarn test:scripts
