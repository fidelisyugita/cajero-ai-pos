name: Release Backend API

on:
  push:
    tags:
      - "backend-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. backend-v1.0.0)"
        required: true
        type: string
      draft:
        description: "Create release as draft"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark release as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Backend Codebase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Gradle Tests
        run: ./gradlew test

  create-release:
    name: Create GitHub Release
    needs: [verify]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine Tag and Version
        id: tag-info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          VERSION="${TAG#backend-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate Rich Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node ./scripts/generate-release-notes.js \
            --workspace backend \
            --tag "${{ steps.tag-info.outputs.tag_name }}" \
            --output ./release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag-info.outputs.tag_name }}"
          TITLE="Backend API v${{ steps.tag-info.outputs.version }}"
          FLAGS=""
          if [ "${{ inputs.draft }}" = "true" ]; then
            FLAGS="$FLAGS --draft"
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            FLAGS="$FLAGS --prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release edit "$TAG" --title "$TITLE" --notes-file ./release-notes.md $FLAGS
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" --title "$TITLE" --notes-file ./release-notes.md $FLAGS
          fi
